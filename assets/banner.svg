<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030d"/>
      <stop offset="60%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#150a2e"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="45%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#bgGrad)"/>

  <!-- stars -->
  <g fill="#facc15" opacity="0.9">
    <circle cx="60" cy="35" r="1.6"/>
    <circle cx="130" cy="70" r="1.2"/>
    <circle cx="45" cy="140" r="1.4"/>
    <circle cx="180" cy="30" r="1.1"/>
    <circle cx="760" cy="45" r="1.5"/>
    <circle cx="820" cy="90" r="1.2"/>
    <circle cx="850" cy="200" r="1.4"/>
    <circle cx="700" cy="210" r="1.1"/>
    <circle cx="600" cy="30" r="1.3"/>
    <circle cx="500" cy="20" r="1.1"/>
  </g>
  <g fill="#e879f9" opacity="0.8">
    <circle cx="100" cy="200" r="1.3"/>
    <circle cx="230" cy="150" r="1.1"/>
    <circle cx="780" cy="150" r="1.3"/>
    <circle cx="650" cy="70" r="1.1"/>
  </g>

  <!-- circuit traces (left) -->
  <g stroke="#67e8f9" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M20,90 L70,90 L70,50 L110,50"/>
    <path d="M20,180 L60,180 L60,220 L120,220"/>
    <path d="M30,130 L90,130 L90,160 L150,160"/>
  </g>
  <g fill="#67e8f9" opacity="0.7">
    <circle cx="110" cy="50" r="3"/>
    <circle cx="70" cy="90" r="2.5"/>
    <circle cx="120" cy="220" r="3"/>
    <circle cx="150" cy="160" r="2.5"/>
  </g>

  <!-- circuit traces (right) -->
  <g stroke="#c084fc" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M880,80 L830,80 L830,40 L790,40"/>
    <path d="M880,170 L840,170 L840,210 L780,210"/>
    <path d="M870,120 L810,120 L810,150 L760,150"/>
  </g>
  <g fill="#c084fc" opacity="0.7">
    <circle cx="790" cy="40" r="3"/>
    <circle cx="830" cy="80" r="2.5"/>
    <circle cx="780" cy="210" r="3"/>
    <circle cx="760" cy="150" r="2.5"/>
  </g>

  <!-- crescent moon -->
  <g filter="url(#softGlow)">
    <circle cx="130" cy="130" r="72" fill="url(#moonGrad)"/>
    <circle cx="160" cy="118" r="66" fill="url(#bgGrad)"/>
  </g>

  <!-- code bracket accent -->
  <text x="118" y="142" font-family="Fira Code, monospace" font-size="30" fill="#0d0221" opacity="0.85">&lt;/&gt;</text>

  <!-- LIS -->
  <text x="330" y="150" font-family="Fira Code, monospace" font-weight="700" font-size="92" fill="url(#textGrad)" filter="url(#glow)">LIS</text>

  <!-- username -->
  <text x="335" y="190" font-family="Fira Code, monospace" font-size="24" fill="#fef3c7" opacity="0.9">@duskfrag-lis</text>
</svg>
